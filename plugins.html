<body>
  <a class="skip" href="#list">Skip to the plugins</a>

  <header class="wrap topbar">
    <a class="mark" href="./" aria-label="Kitly home">
      <span class="mark-tile" aria-hidden="true">K</span>Kitly

    <nav class="nav" aria-label="Main">
      <a href="./#apps">Apps</a>

      <a href="https://github.com/direkjames" data-profile target="_blank" rel="noopener">GitHub</a>

  <main class="wrap">
    <div class="page-head">
      <h1 class="page-title">Minecraft plugins</h1>
      <p class="page-lede">Every plugin on Kitly, for Paper and Purpur servers. Each card opens the plugin's page on GitHub.</p>
    </div>

    <div class="search">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" data-search placeholder="Search plugins" aria-label="Search plugins" autocomplete="off">
      </div>
      <p class="count" data-count aria-live="polite"></p>
    </div>

    <div class="plugins" id="list" data-plugins-all></div>

    <div class="empty" data-empty hidden>
      <p>No plugins match <strong>&ldquo;<span data-empty-term></span>&rdquo;</strong>. Try a shorter word, like &ldquo;bank&rdquo; or &ldquo;chat&rdquo;.</p>
      <button class="btn btn-line" type="button" data-clear>Clear search</button>
    </div>

    <noscript>
      <p class="noscript">Kitly needs JavaScript to list its plugins. You can also find everything at <a href="https://github.com/direkjames">github.com/direkjames</a>.</p>
    </noscript>
  </main>
